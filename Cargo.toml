[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/vault-cli"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Trigenys/tholosvault"
rust-version = "1.80"

[workspace.dependencies]
vault-core = { path = "crates/vault-core", version = "0.1.0" }
fastcdc = "5.0"
blake3 = "1.8"
zstd = "0.14"
memmap2 = "0.9"
crc32c = "0.6"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
