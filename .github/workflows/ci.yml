# CI change-scoped : l'analyse d'impact AppFactory décide des gates, chaque job
# ne tourne que si son gate est requis. Politique : .github/appfactory-impact.json.
# AppFactory épinglé par SHA revu (main du 2026-11-16, contient reusable-impact-analysis.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@3fbf1825593a998e47d72994d4a1034d127bef1c
    with:
      appfactory_ref: 3fbf1825593a998e47d72994d4a1034d127bef1c
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  rust:
    name: rust (${{ matrix.os }})
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'rust') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fuse3 (montage réel de vault-mount)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q fuse3
      - name: tholos démarre sans le pilote WinFsp (liaison différée)
        if: matrix.os == 'windows-latest'
        run: cargo run -p vault-cli --quiet -- --version
      - name: WinFsp (montage réel de vault-mount)
        if: matrix.os == 'windows-latest'
        run: choco install winfsp --version=2.2.26323 -y --no-progress
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --quiet
      - name: vault-core sans la fonctionnalité parallel (sortie identique)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p vault-core --no-default-features --quiet
      - name: vault-mount sans adaptateur (cœur seul)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p vault-mount --no-default-features --quiet
      - name: vault-mount, montage FUSE réel
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p vault-mount --test fuse_mount --quiet -- --ignored
      - name: vault-mount, montage WinFsp réel
        if: matrix.os == 'windows-latest'
        run: cargo test -p vault-mount --features winfsp --test winfsp_mount --quiet -- --ignored
      - run: cargo build --workspace --release --quiet

  bench:
    name: bench (profil ci, ${{ matrix.os }})
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'bench') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: fuse3 (H4 mesure un montage réel)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q fuse3
      - name: WinFsp (H4 mesure un montage réel)
        if: matrix.os == 'windows-latest'
        run: choco install winfsp --version=2.2.26323 -y --no-progress
      - name: Thèses H1–H8, profil ci (seuils bloquants, montage exigé)
        shell: bash
        run: cargo run -p vault-bench --release --locked --quiet -- --profile ci --require-env mount --out bench/results --summary-md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ci-${{ matrix.os }}
          path: |
            bench/results/ci.json
            bench/results/ci.csv
