[package]
name = "vault-core"
version = "0.1.0"
description = "Cœur du format tholosvault : CDC, zstd par morceau, Merkle BLAKE3, index en clair."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fastcdc.workspace = true
blake3.workspace = true
zstd.workspace = true
memmap2.workspace = true
crc32c.workspace = true
thiserror.workspace = true
reed-solomon-simd.workspace = true
rayon = { workspace = true, optional = true }

[features]
# Encodage de la parité par groupe en parallèle (rayon). Désactiver pour un
# cœur unique ou une empreinte minimale : `--no-default-features`.
default = ["parallel"]
parallel = ["dep:rayon"]

[dev-dependencies]
tempfile.workspace = true
