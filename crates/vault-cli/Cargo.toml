[package]
name = "vault-cli"
version = "0.1.0"
description = "CLI tholos : pack, list, verify, repair, extract, cat, mount."
edition.workspace = true
license.workspace = true
repository.workspace = true
# vault-mount (fuser 0.18) impose 1.85 ; voir crates/vault-mount/README.md.
rust-version = "1.85"
build = "build.rs"

# Chaque adaptateur est inerte hors de son OS (dépendance sous cfg dans
# vault-mount) : les activer tous deux donne le bon pilote sur chaque cible.
[features]
default = ["fuse", "winfsp"]
fuse = ["vault-mount/fuse"]
winfsp = ["vault-mount/winfsp", "dep:winfsp"]

[[bin]]
name = "tholos"
path = "src/main.rs"

[dependencies]
vault-core.workspace = true
clap.workspace = true
anyhow.workspace = true
vault-mount.workspace = true
ctrlc.workspace = true

# Émet /DELAYLOAD:winfsp-x64.dll pour le binaire `tholos` (voir build.rs).
[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", optional = true, default-features = false, features = ["delayload"] }
