[package]
name = "vault-cli"
version = "0.1.0"
description = "CLI tholos : pack, list, verify, repair, extract, cat, mount, fetch."
edition.workspace = true
license.workspace = true
repository.workspace = true
# vault-mount (fuser 0.18) impose 1.85 ; voir crates/vault-mount/README.md.
rust-version = "1.85"

[features]
default = ["fuse"]
fuse = ["vault-mount/fuse"]

[[bin]]
name = "tholos"
path = "src/main.rs"

[dependencies]
vault-core.workspace = true
clap.workspace = true
anyhow.workspace = true
vault-mount.workspace = true
ctrlc.workspace = true
vault-fetch.workspace = true
vault-fetch-http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
