[package]
name = "vault-api"
version = "0.1.0"
description = "API HTTP en lecture seule (Axum) sur un répertoire d'archives .vault : catalogue, bilan, liste, lecture par plage vérifiée, vérification."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"

[[bin]]
name = "tholos-api"
path = "src/main.rs"

[dependencies]
vault-core.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-range-header = "1.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
