[package]
name = "vault-bench"
version = "0.1.0"
description = "Bench public des thèses H1–H8 : corpus synthétique, protocole, seuils bloquants."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
# vault-mount (fuser 0.18) impose 1.85 ; voir crates/vault-mount/README.md.
rust-version = "1.85"
build = "build.rs"

# Comme vault-cli : chaque adaptateur est inerte hors de son OS.
[features]
default = ["winfsp"]
winfsp = ["vault-mount/winfsp", "dep:winfsp"]

[[bin]]
name = "tholos-bench"
path = "src/main.rs"

[dependencies]
vault-core.workspace = true
vault-mount = { workspace = true, features = ["fuse"] }
zstd.workspace = true
blake3.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Émet /DELAYLOAD:winfsp-x64.dll pour le binaire `tholos-bench` (voir build.rs).
[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", optional = true, default-features = false, features = ["delayload"] }
