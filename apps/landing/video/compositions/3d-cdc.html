<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; color: #EEF2F7; background: #0B1220; }
    #cdc-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #cdc-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,32,.25) 0%, rgba(11,18,32,0) 28%, rgba(11,18,32,0) 58%, rgba(11,18,32,.88) 100%); }
    #cdc-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
    #cdc-flash { position: absolute; inset: 0; background: #0B1220; opacity: 0; }
    .line { position: absolute; left: 10%; right: 10%; bottom: 11%; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; text-align: center; line-height: 1.2; text-shadow: 0 3px 28px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.7); }
    .w { display: inline-block; opacity: 0; }
    .acc { color: #F5B400; }
  </style>
  <div id="root" data-composition-id="cdc" data-layout-allow-overflow data-layout-allow-overlap>
    <canvas id="cdc-gl" width="1920" height="1080"></canvas>
    <div id="cdc-vig"></div>
    <div id="cdc-shade"></div>
    <p class="line" id="cdc-line1">On coupe là où le <b>contenu</b> le décide.</p>
    <p class="line" id="cdc-line2">Un ajout au début : <b>un seul</b> morceau change.</p>
    <div id="cdc-flash"></div>
  </div>
  <script>
    function vwords(sel) {
      const el = document.querySelector(sel); const out = [];
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) { const raw = n.textContent; raw.trim().split(' ').filter(Boolean).forEach((w, i) => { if (i === 0 && out.length && raw.charAt(0) !== ' ') { out[out.length - 1].textContent += w; return; } const s = document.createElement('span'); s.className = 'w'; s.textContent = w; out.push(s); }); }
        else { const s = document.createElement('span'); s.className = 'w acc'; s.textContent = n.textContent; out.push(s); }
      });
      el.innerHTML = ''; out.forEach(s => { el.appendChild(s); el.appendChild(document.createTextNode(' ')); });
      return out;
    }
    function lineIn(tl, sel, at) { const w = vwords(sel); tl.fromTo(w, { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.06, ease: 'power4.out' }, at); return w; }
    function lineOut(tl, w, at) { tl.to(w, { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.2, stagger: 0.02, ease: 'power3.in' }, at); }

    (function () {
      const T = 10, V = window.V3D, PAL = V.PAL;
      const tl = gsap.timeline({ paused: true });
      const stg = V.stage(document.getElementById('cdc-gl'), { seed: 213 });
      const { scene, st, rng } = stg;
      const C = PAL.chunks.map(c => new THREE.Color(c));
      const col = (mat, hex, at, d) => { const c = new THREE.Color(hex); tl.to(mat.color, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); };
      const glow = (mat, hex, i, at, d) => { const c = new THREE.Color(hex); tl.to(mat.emissive, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); tl.to(mat, { emissiveIntensity: i, duration: d || 0.3 }, at); };
      // --- scene: cdc ---
      // Content-defined chunking: blades cut where the data decides; an insert only reshapes the first chunk.
      const widths = [1.6, 1.1, 2.0, 0.9, 1.4, 1.2, 1.8, 1.0, 1.5, 1.3, 1.7, 1.1];
      const row = new THREE.Group(); scene.add(row);
      const chunks = []; let x = -9.4;
      widths.forEach((w, i) => {
        const c = V.box(w, 1.25, 1.25, PAL.chunks[i % 8]); c.position.set(x + w / 2, -0.55, 0); row.add(c); chunks.push(c); x += w + 0.22;
      });
      const blades = []; let bx = -9.4;
      widths.forEach((w, i) => {
        bx += w + 0.11;
        if (i === widths.length - 1) return;
        const b = V.box(0.07, 2.6, 1.7, 0xEEF2F7, { glow: 0.9, radius: 0.02, outline: 0 }); b.position.set(bx, 4.2, 0); row.add(b); blades.push(b); bx += 0.11;
      });
      const insert = V.box(0.6, 1.25, 1.25, PAL.amber, { glow: 0.7 }); insert.position.set(-13, -0.55, 0); row.add(insert);
      // row drifts left as the camera tracks it
      tl.fromTo(row.position, { x: 1.2 }, { x: -1.0, duration: T, ease: 'none' }, 0);
      // blades drop at the cut points, then lift
      blades.forEach((b, i) => {
        const at = 0.8 + i * 0.14;
        tl.to(b.position, { y: -0.55, duration: 0.22, ease: 'power3.in' }, at);
        tl.to(b.scale, { x: 1.8, duration: 0.08, yoyo: true, repeat: 1 }, at + 0.2);
        tl.to(b.position, { y: 3.6, duration: 0.5, ease: 'power2.out' }, at + 0.55);
        tl.to(b.scale, { y: 0.01, duration: 0.3 }, at + 0.8);
      });
      chunks.forEach((c, i) => tl.to(c.position, { y: -0.3, duration: 0.25, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.95 + i * 0.14));
      // second half: ten bytes added at the front
      tl.to(insert.position, { x: -9.4 - 0.3 - 0.1, duration: 0.8, ease: 'power3.out' }, 5.0);
      tl.to(insert.position, { x: -9.4 + 0.3, duration: 0.35, ease: 'power2.in' }, 5.8);
      tl.to(insert.scale, { x: 0.01, duration: 0.2 }, 6.05);
      tl.to(chunks[0].scale, { x: 1.38, duration: 0.45, ease: 'back.out(1.6)' }, 6.1);
      tl.to(chunks[0].position, { x: chunks[0].position.x - 0.3, duration: 0.45, ease: 'back.out(1.6)' }, 6.1);
      glow(chunks[0].fill.material, PAL.amber, 0.4, 6.1, 0.3);
      col(chunks[0].fill.material, PAL.amber, 6.1, 0.3);
      chunks.slice(1).forEach((c, i) => { glow(c.fill.material, PAL.green, 0.8, 6.7 + i * 0.07, 0.2); glow(c.fill.material, PAL.green, 0.0, 7.4 + i * 0.07, 0.4); });
      // camera: lateral tracking shot
      st.cx = -4.5; st.cy = 3.4; st.cz = 11.5; st.tx = -4.0; st.ty = -0.2; st.tz = 0;
      tl.to(st, { cx: 1.0, cy: 2.6, cz: 9.0, tx: 1.5, ty: -0.3, duration: T, ease: 'none' }, 0);

      // --- captions + cut ---
      tl.fromTo('#cdc-flash', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      const w1 = lineIn(tl, '#cdc-line1', 0.5);
      lineOut(tl, w1, 4.60);
      const w2 = lineIn(tl, '#cdc-line2', 5.00);
      lineOut(tl, w2, 9.40);
      tl.to('#cdc-flash', { opacity: 1, duration: 0.35, ease: 'power2.in' }, 9.65);
      tl.eventCallback('onUpdate', stg.render);
      window.__timelines['cdc'] = tl;
      stg.render();
    })();
  </script>
</template>
