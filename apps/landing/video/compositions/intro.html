  <script>
    function vwords(sel) {
      const el = document.querySelector(sel); const out = [];
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) { { const raw = n.textContent; raw.trim().split(/\s+/).filter(Boolean).forEach((w, i) => { if (i === 0 && out.length && !/^\s/.test(raw)) { out[out.length - 1].textContent += w; return; } const s = document.createElement('span'); s.className = 'w'; s.textContent = w; out.push(s); }); } }
        else { const s = document.createElement('span'); s.className = 'w acc'; s.textContent = n.textContent; out.push(s); }
      });
      el.innerHTML = ''; out.forEach(s => { el.appendChild(s); el.appendChild(document.createTextNode(' ')); });
      return out;
    }
    function lineIn(tl, sel, at) { const w = vwords(sel); tl.fromTo(w, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power4.out' }, at); return w; }
    function lineOut(tl, w, at) { tl.to(w, { opacity: 0, filter: 'blur(6px)', duration: 0.15, stagger: 0.025, ease: 'power3.in' }, at); }

    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#intro-box', { y: 30 }, { y: 0, duration: 0.6, ease: 'expo.out' }, 0);
    tl.fromTo('#intro-disk', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 0.45);
    tl.fromTo('#intro-fill', { scaleX: 0.4 }, { scaleX: 0.4, duration: 0.01 }, 0);
    const w1 = lineIn(tl, '#intro-line', 1.0);
    tl.to('#intro-lid', { rotateX: -110, duration: 0.5, ease: 'power3.out' }, 1.8);
    const files = gsap.utils.toArray('.f');
    files.forEach((f, i) => {
      const t0 = 2.1 + i * 0.3;
      tl.fromTo(f, { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 760 + (i % 3) * 20, y: 20 + (i % 4) * 8, duration: 0.5, ease: 'power2.inOut' }, t0);
      tl.to(f, { opacity: 0, duration: 0.15 }, t0 + 0.5);
    });
    tl.to('#intro-fill', { scaleX: 1, duration: 3.6, ease: 'none' }, 2.1);
    const clock = { t: 0 };
    const timer = document.getElementById('intro-timer');
    tl.to(clock, { t: 900, duration: 3.6, ease: 'none', onUpdate: () => { const s = Math.round(clock.t); timer.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); } }, 2.1);
    tl.to('#intro-fill', { backgroundColor: '#E5484D', duration: 0.3 }, 5.7);
    tl.fromTo('#intro-full', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.4)' }, 5.8);
    lineOut(tl, w1, 7.4);
    tl.to(['#intro-box', '#intro-disk'], { opacity: 0, filter: 'blur(8px)', duration: 0.25, ease: 'power3.in' }, 7.6);
    window.__timelines['intro'] = tl;
