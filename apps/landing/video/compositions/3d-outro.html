<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; color: #EEF2F7; background: #0B1220; }
    #outro-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #outro-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,32,.25) 0%, rgba(11,18,32,0) 28%, rgba(11,18,32,0) 58%, rgba(11,18,32,.88) 100%); }
    #outro-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
    #outro-flash { position: absolute; inset: 0; background: #0B1220; opacity: 0; }
    .line { position: absolute; left: 10%; right: 10%; bottom: 11%; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; text-align: center; line-height: 1.2; text-shadow: 0 3px 28px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.7); }
    .w { display: inline-block; opacity: 0; }
    .acc { color: #F5B400; }
  </style>
  <div id="root" data-composition-id="outro" data-layout-allow-overflow data-layout-allow-overlap>
    <canvas id="outro-gl" width="1920" height="1080"></canvas>
    <div id="outro-vig"></div>
    <div id="outro-shade"></div>
    <p class="line" id="outro-line1">Une seule <b>découpe</b> sert à tout.</p>
    <p class="line" id="outro-line2">L'intelligence à l'encodage. Un lecteur <b>simple, rapide, prévisible</b>.</p>
    <div id="outro-flash"></div>
  </div>
  <script>
    function vwords(sel) {
      const el = document.querySelector(sel); const out = [];
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) { const raw = n.textContent; raw.trim().split(' ').filter(Boolean).forEach((w, i) => { if (i === 0 && out.length && raw.charAt(0) !== ' ') { out[out.length - 1].textContent += w; return; } const s = document.createElement('span'); s.className = 'w'; s.textContent = w; out.push(s); }); }
        else { const s = document.createElement('span'); s.className = 'w acc'; s.textContent = n.textContent; out.push(s); }
      });
      el.innerHTML = ''; out.forEach(s => { el.appendChild(s); el.appendChild(document.createTextNode(' ')); });
      return out;
    }
    function lineIn(tl, sel, at) { const w = vwords(sel); tl.fromTo(w, { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.06, ease: 'power4.out' }, at); return w; }
    function lineOut(tl, w, at) { tl.to(w, { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.2, stagger: 0.02, ease: 'power3.in' }, at); }

    (function () {
      const T = 7, V = window.V3D, PAL = V.PAL;
      const tl = gsap.timeline({ paused: true });
      const stg = V.stage(document.getElementById('outro-gl'), { seed: 718 });
      const { scene, st, rng } = stg;
      const C = PAL.chunks.map(c => new THREE.Color(c));
      const col = (mat, hex, at, d) => { const c = new THREE.Color(hex); tl.to(mat.color, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); };
      const glow = (mat, hex, i, at, d) => { const c = new THREE.Color(hex); tl.to(mat.emissive, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); tl.to(mat, { emissiveIntensity: i, duration: d || 0.3 }, at); };
      // --- scene: outro ---
      // One archive, one cut, four uses orbiting it.
      const hero = new THREE.Group(); hero.position.set(0, 1.0, 0); scene.add(hero);
      const core = V.box(3.0, 3.0, 3.0, 0x1C2A44, { radius: 0.22 }); hero.add(core);
      const seams = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.02, 3.02, 3.02)), new THREE.LineBasicMaterial({ color: PAL.amber, transparent: true, opacity: 0.0 })); hero.add(seams);
      const cuts = [0.7, 1.3, 2.2];
      cuts.forEach(c => { const s = V.box(0.06, 3.1, 3.1, PAL.amber, { glow: 1.0, radius: 0.01, outline: 0 }); s.position.x = -1.5 + c; s.scale.y = 0.01; hero.add(s); s.cut = true; });
      const mk = (geo, color) => { const g = new THREE.Group(); const f = new THREE.Mesh(geo, V.toon(color, { emissive: color, emissiveIntensity: 0.18 })); f.castShadow = true; g.add(f); g.fill = f; return g; };
      const ring = new THREE.Group(); ring.position.y = 1.0; scene.add(ring);
      const sats = [mk(new THREE.TorusGeometry(0.42, 0.16, 12, 32), PAL.chunks[0]), mk(new THREE.SphereGeometry(0.5, 24, 16), PAL.green), mk(new THREE.OctahedronGeometry(0.6), PAL.cyan), mk(new THREE.ConeGeometry(0.5, 0.95, 24), PAL.chunks[2])];
      const spokes = [];
      sats.forEach((s, i) => { const a = i * Math.PI / 2 + 0.6; s.position.set(Math.cos(a) * 4.6, Math.sin(i * 1.7) * 0.6, Math.sin(a) * 4.6); s.scale.setScalar(0.01); ring.add(s); const r = V.rod(PAL.amber, 0.025); r.material.opacity = 0; ring.add(r); spokes.push(r); });
      const upd = () => { sats.forEach((s, i) => { spokes[i].setEnds(new THREE.Vector3(0, 0, 0), s.position); }); };
      upd();
      // hero turns, cuts light up, satellites pop and orbit
      tl.to(hero.rotation, { y: 1.3, duration: T, ease: 'none' }, 0);
      tl.to(hero.position, { y: 1.25, duration: 3.5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);
      tl.to(seams.material, { opacity: 0.9, duration: 0.8 }, 0.6);
      hero.children.filter(c => c.cut).forEach((s, i) => tl.to(s.scale, { y: 1.02, duration: 0.35, ease: 'power3.out' }, 1.0 + i * 0.2));
      sats.forEach((s, i) => { tl.to(s.scale, { x: 1, y: 1, z: 1, duration: 0.45, ease: 'back.out(2)' }, 2.0 + i * 0.22); tl.to(spokes[i].material, { opacity: 0.7, duration: 0.3 }, 2.1 + i * 0.22); tl.to(s.rotation, { y: Math.PI * 2, x: 0.8, duration: T, ease: 'none' }, 0); });
      tl.to(ring.rotation, { y: 1.1, duration: T, ease: 'none', onUpdate: upd }, 0);
      // camera: slow orbit that eases into a hold
      st.cx = 7.5; st.cy = 3.6; st.cz = 9.0; st.tx = 0; st.ty = 1.0; st.tz = 0;
      tl.to(st, { cx: 2.0, cy: 3.0, cz: 11.8, duration: T - 0.6, ease: 'power1.out' }, 0);

      // --- captions + cut ---
      tl.fromTo('#outro-flash', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      const w1 = lineIn(tl, '#outro-line1', 0.5);
      lineOut(tl, w1, 3.10);
      const w2 = lineIn(tl, '#outro-line2', 3.50);
      lineOut(tl, w2, 6.40);
      tl.to('#outro-flash', { opacity: 1, duration: 0.35, ease: 'power2.in' }, 6.65);
      tl.eventCallback('onUpdate', stg.render);
      window.__timelines['outro'] = tl;
      stg.render();
    })();
  </script>
</template>
