<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; color: #EEF2F7; background: #0B1220; }
    #delta-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #delta-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,32,.25) 0%, rgba(11,18,32,0) 28%, rgba(11,18,32,0) 58%, rgba(11,18,32,.88) 100%); }
    #delta-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
    #delta-flash { position: absolute; inset: 0; background: #0B1220; opacity: 0; }
    .line { position: absolute; left: 10%; right: 10%; bottom: 11%; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; text-align: center; line-height: 1.2; text-shadow: 0 3px 28px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.7); }
    .w { display: inline-block; opacity: 0; }
    .acc { color: #F5B400; }
  </style>
  <div id="root" data-composition-id="delta" data-layout-allow-overflow data-layout-allow-overlap>
    <canvas id="delta-gl" width="1920" height="1080"></canvas>
    <div id="delta-vig"></div>
    <div id="delta-shade"></div>
    <p class="line" id="delta-line1">Nouvelle version : seuls les morceaux <b>changés</b> voyagent.</p>
    
    <div id="delta-flash"></div>
  </div>
  <script>
    function vwords(sel) {
      const el = document.querySelector(sel); const out = [];
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) { const raw = n.textContent; raw.trim().split(' ').filter(Boolean).forEach((w, i) => { if (i === 0 && out.length && raw.charAt(0) !== ' ') { out[out.length - 1].textContent += w; return; } const s = document.createElement('span'); s.className = 'w'; s.textContent = w; out.push(s); }); }
        else { const s = document.createElement('span'); s.className = 'w acc'; s.textContent = n.textContent; out.push(s); }
      });
      el.innerHTML = ''; out.forEach(s => { el.appendChild(s); el.appendChild(document.createTextNode(' ')); });
      return out;
    }
    function lineIn(tl, sel, at) { const w = vwords(sel); tl.fromTo(w, { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.06, ease: 'power4.out' }, at); return w; }
    function lineOut(tl, w, at) { tl.to(w, { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.2, stagger: 0.02, ease: 'power3.in' }, at); }

    (function () {
      const T = 7, V = window.V3D, PAL = V.PAL;
      const tl = gsap.timeline({ paused: true });
      const stg = V.stage(document.getElementById('delta-gl'), { seed: 617 });
      const { scene, st, rng } = stg;
      const C = PAL.chunks.map(c => new THREE.Color(c));
      const col = (mat, hex, at, d) => { const c = new THREE.Color(hex); tl.to(mat.color, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); };
      const glow = (mat, hex, i, at, d) => { const c = new THREE.Color(hex); tl.to(mat.emissive, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); tl.to(mat, { emissiveIntensity: i, duration: d || 0.3 }, at); };
      // --- scene: delta ---
      // Two versions side by side: only the three changed chunks travel.
      const changed = [1, 4, 6], left = [], right = [], movers = [];
      const pos = (cx, i) => new THREE.Vector3(cx - 2.0 + (i % 4) * 1.35, 1.55 - Math.floor(i / 4) * 1.35, 0);
      const base = V.box(6.0, 0.25, 2.2, 0x16233C); base.position.set(-3.8, -1.1, 0); scene.add(base);
      const base2 = base.clone(); base2.position.x = 3.8; scene.add(base2);
      for (let i = 0; i < 8; i++) {
        const a = V.box(1.1, 1.1, 0.6, PAL.chunks[i]); a.position.copy(pos(-3.8, i)); scene.add(a); left.push(a);
        const isNew = changed.includes(i);
        const b = V.box(1.1, 1.1, 0.6, isNew ? PAL.amber : PAL.chunks[i], { glow: isNew ? 0.3 : 0 }); b.position.copy(pos(3.8, i)); scene.add(b); right.push(b);
        if (isNew) { b.scale.setScalar(0.01); const m = V.box(1.1, 1.1, 0.6, PAL.amber, { glow: 0.35 }); m.position.copy(pos(-3.8, i)); m.scale.setScalar(0.01); scene.add(m); movers.push({ m, i }); }
        else { const g = new THREE.Mesh(new THREE.BoxGeometry(1.14, 1.14, 0.64), new THREE.MeshBasicMaterial({ color: PAL.ink, transparent: true, opacity: 0.0 })); g.position.copy(b.position); scene.add(g); b.dim = g; }
      }
      // mark the changed chunks on the left
      changed.forEach((i, k) => { const a = left[i]; col(a.fill.material, PAL.amber, 1.0 + k * 0.1, 0.3); glow(a.fill.material, PAL.amber, 0.35, 1.0 + k * 0.1, 0.3); tl.to(a.position, { z: 0.35, duration: 0.3, ease: 'back.out(2)' }, 1.0 + k * 0.1); });
      // copies fly across in an arc, land, and the right side fills in
      movers.forEach(({ m, i }, k) => {
        const from = pos(-3.8, i), to = pos(3.8, i), at = 1.9 + k * 0.35;
        tl.to(m.scale, { x: 1, y: 1, z: 1, duration: 0.15 }, at);
        tl.to(m.position, { x: to.x, duration: 1.0, ease: 'power1.inOut' }, at);
        tl.to(m.position, { y: from.y + 2.4, duration: 0.5, ease: 'power2.out' }, at);
        tl.to(m.position, { y: to.y, duration: 0.5, ease: 'power2.in' }, at + 0.5);
        tl.to(m.rotation, { y: Math.PI * 2, duration: 1.0, ease: 'power1.inOut' }, at);
        tl.to(m.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.01 }, at + 1.0);
        tl.to(right[i].scale, { x: 1, y: 1, z: 1, duration: 0.4, ease: 'back.out(2.5)' }, at + 1.0);
        glow(left[i].fill.material, PAL.amber, 0.0, at + 1.0, 0.4); tl.to(left[i].position, { z: 0, duration: 0.3 }, at + 1.0);
      });
      right.forEach(b => { if (b.dim) { tl.to(b.dim.material, { opacity: 0.45, duration: 0.5 }, 1.0); tl.to(b.dim.material, { opacity: 0.0, duration: 0.5 }, 4.3); } });
      // camera: lateral move, left to right
      st.cx = -2.5; st.cy = 2.6; st.cz = 11.5; st.tx = -1.2; st.ty = 0.8; st.tz = 0;
      tl.to(st, { cx: 2.2, cy: 2.4, cz: 10.8, tx: 1.2, ty: 0.7, duration: T, ease: 'none' }, 0);

      // --- captions + cut ---
      tl.fromTo('#delta-flash', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      const w1 = lineIn(tl, '#delta-line1', 0.5);
      lineOut(tl, w1, 6.40);
      tl.to('#delta-flash', { opacity: 1, duration: 0.35, ease: 'power2.in' }, 6.65);
      tl.eventCallback('onUpdate', stg.render);
      window.__timelines['delta'] = tl;
      stg.render();
    })();
  </script>
</template>
