<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; color: #EEF2F7; background: #0B1220; }
    #mount-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #mount-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,32,.25) 0%, rgba(11,18,32,0) 28%, rgba(11,18,32,0) 58%, rgba(11,18,32,.88) 100%); }
    #mount-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
    #mount-flash { position: absolute; inset: 0; background: #0B1220; opacity: 0; }
    .line { position: absolute; left: 10%; right: 10%; bottom: 11%; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; text-align: center; line-height: 1.2; text-shadow: 0 3px 28px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.7); }
    .w { display: inline-block; opacity: 0; }
    .acc { color: #F5B400; }
  </style>
  <div id="root" data-composition-id="mount" data-layout-allow-overflow data-layout-allow-overlap>
    <canvas id="mount-gl" width="1920" height="1080"></canvas>
    <div id="mount-vig"></div>
    <div id="mount-shade"></div>
    <p class="line" id="mount-line1">VAULT : on <b>branche</b> l'archive, on ne l'ouvre pas.</p>
    <p class="line" id="mount-line2">Prêt en <b>moins d'une seconde</b>.</p>
    <div id="mount-flash"></div>
  </div>
  <script>
    function vwords(sel) {
      const el = document.querySelector(sel); const out = [];
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) { const raw = n.textContent; raw.trim().split(' ').filter(Boolean).forEach((w, i) => { if (i === 0 && out.length && raw.charAt(0) !== ' ') { out[out.length - 1].textContent += w; return; } const s = document.createElement('span'); s.className = 'w'; s.textContent = w; out.push(s); }); }
        else { const s = document.createElement('span'); s.className = 'w acc'; s.textContent = n.textContent; out.push(s); }
      });
      el.innerHTML = ''; out.forEach(s => { el.appendChild(s); el.appendChild(document.createTextNode(' ')); });
      return out;
    }
    function lineIn(tl, sel, at) { const w = vwords(sel); tl.fromTo(w, { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.06, ease: 'power4.out' }, at); return w; }
    function lineOut(tl, w, at) { tl.to(w, { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.2, stagger: 0.02, ease: 'power3.in' }, at); }

    (function () {
      const T = 7, V = window.V3D, PAL = V.PAL;
      const tl = gsap.timeline({ paused: true });
      const stg = V.stage(document.getElementById('mount-gl'), { seed: 112 });
      const { scene, st, rng } = stg;
      const C = PAL.chunks.map(c => new THREE.Color(c));
      const col = (mat, hex, at, d) => { const c = new THREE.Color(hex); tl.to(mat.color, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); };
      const glow = (mat, hex, i, at, d) => { const c = new THREE.Color(hex); tl.to(mat.emissive, { r: c.r, g: c.g, b: c.b, duration: d || 0.3 }, at); tl.to(mat, { emissiveIntensity: i, duration: d || 0.3 }, at); };
      // --- scene: mount ---
      // Plug the archive like a drive: a cable grows, the screen lights up with files.
      const crate = V.box(3.6, 2.6, 2.8, 0x24365A); crate.position.set(-5.2, 0.1, 0); scene.add(crate);
      const lid = V.box(3.8, 0.35, 3.0, 0x3A4F7E); lid.position.set(-5.2, 1.55, 0); scene.add(lid);
      const port = V.box(0.5, 0.3, 0.2, PAL.amber, { glow: 0.8 }); port.position.set(-3.4, 0.0, 0.6); scene.add(port);
      const laptop = new THREE.Group(); laptop.position.set(3.4, -1.2, 0.4); laptop.rotation.y = -0.28; scene.add(laptop);
      const base = V.box(5.6, 0.22, 3.4, 0x1A2744); base.position.set(0, 0.11, 0); laptop.add(base);
      const screen = V.box(5.5, 3.4, 0.22, 0x16233C); screen.position.set(0, 2.0, -1.6); screen.rotation.x = -0.12; laptop.add(screen);
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(5.1, 3.0), new THREE.MeshBasicMaterial({ color: 0x0E1830 }));
      panel.position.set(0, 2.0, -1.47); panel.rotation.x = -0.12; laptop.add(panel);
      const tiles = [];
      for (let i = 0; i < 12; i++) {
        const t = V.box(1.05, 0.72, 0.08, PAL.chunks[i % 8], { radius: 0.04, glow: 0.25 });
        const cx = -1.9 + (i % 4) * 1.27, cy = 0.95 - Math.floor(i / 4) * 0.95;
        t.position.set(cx, 2.0 + cy, -1.4 + cy * 0.12); t.rotation.x = -0.12; t.scale.setScalar(0.01);
        laptop.add(t); tiles.push(t);
      }
      // cable (tube revealed through drawRange)
      const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-3.2, 0.0, 0.7), new THREE.Vector3(-1.8, -0.95, 1.9), new THREE.Vector3(0.4, -1.05, 2.0), new THREE.Vector3(1.6, -0.6, 1.5), new THREE.Vector3(1.9, -0.3, 1.2)]);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 72, 0.075, 8, false), new THREE.MeshBasicMaterial({ color: PAL.amber }));
      const total = tube.geometry.index.count; tube.geometry.setDrawRange(0, 0); scene.add(tube);
      const plug = V.orb(0.16, PAL.amber, 1.0); plug.position.copy(curve.getPoint(0)); plug.scale.setScalar(0.01); scene.add(plug);
      const prog = { p: 0 };
      tl.to(prog, { p: 1, duration: 1.4, ease: 'power2.inOut', onUpdate: () => { tube.geometry.setDrawRange(0, Math.floor(total * prog.p)); plug.position.copy(curve.getPoint(prog.p)); } }, 0.7);
      tl.to(plug.scale, { x: 1, y: 1, z: 1, duration: 0.3, ease: 'back.out(2)' }, 0.7);
      tl.to(plug.scale, { x: 1.6, y: 1.6, z: 1.6, duration: 0.18, yoyo: true, repeat: 1 }, 2.1);
      // screen wakes, tiles pop in a grid
      col(panel.material, 0x1C2E55, 2.2, 0.4);
      tiles.forEach((t, i) => tl.to(t.scale, { x: 1, y: 1, z: 1, duration: 0.35, ease: 'back.out(2.2)' }, 2.35 + i * 0.045));
      tiles.forEach((t, i) => tl.to(t.position, { y: t.position.y + 0.05, duration: 0.6, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 3.4 + i * 0.03));
      // camera: slow pull-back
      st.cx = 2.4; st.cy = 3.4; st.cz = 9.5; st.tx = 0.6; st.ty = 0.6; st.tz = 0;
      tl.to(st, { cx: -0.4, cy: 3.0, cz: 13.2, tx: -0.4, ty: 0.3, duration: T, ease: 'none' }, 0);

      // --- captions + cut ---
      tl.fromTo('#mount-flash', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      const w1 = lineIn(tl, '#mount-line1', 0.5);
      lineOut(tl, w1, 3.10);
      const w2 = lineIn(tl, '#mount-line2', 3.50);
      lineOut(tl, w2, 6.40);
      tl.to('#mount-flash', { opacity: 1, duration: 0.35, ease: 'power2.in' }, 6.65);
      tl.eventCallback('onUpdate', stg.render);
      window.__timelines['mount'] = tl;
      stg.render();
    })();
  </script>
</template>
